# ============================================================
#  polybar config — Maomao (main)
#  ~/.config/polybar/config.ini
# ============================================================

# ── Maomao palette (extracted from ~/Pictures/Maomao_HD.jpg) ─
[colors]
base      = #16201F
surface   = #213433
overlay   = #2C4644
muted     = #68958F
subtle    = #9A7683
text      = #ECC5CE
love      = #D8ABB6
gold      = #D3A171
rose      = #E6BAC4
pine      = #3B8670
foam      = #AEC3BF
iris      = #478F72
hl-low    = #1D2C2A
hl-med    = #3F5B59
hl-high   = #5C8480
transparent = #00000000

# ── Bar ─────────────────────────────────────────────────────
[bar/main]
monitor               =
width                 = 100%:-24
height                = 38
offset-x              = 12
offset-y              = 10
radius                = 16

; Maomao surface
background            = ${colors.surface}
foreground            = ${colors.text}

line-size             = 2
line-color            = ${colors.pine}

border-size           = 0
padding-left          = 2
; 3, not 2: tray icons carry their own transparent margin, so the wifi icon sat
; only 19px off the bar's edge against a 31px gap to its separator and looked
; shoved into the corner. This shifts the whole right group left as a unit, so
; the separator gap is unchanged and only the edge margin grows.
padding-right         = 3
module-margin-left    = 1
module-margin-right   = 1

; Nerd Font — same as kitty & nvim
font-0 = "JetBrainsMono Nerd Font:pixelsize=12:antialias=true;3"
font-1 = "JetBrainsMono Nerd Font:pixelsize=14:antialias=true;4"
font-2 = "Noto Color Emoji:pixelsize=12;3"

modules-left   = i3 sep xwindow
modules-center = date
modules-right  = sep battery sep brightness volume sep network sep tray

; no bar-level tray-* keys: the legacy tray is a square sub-window pinned flush
; to the bar's right edge, which flattens the radius(16) corner and can't be
; nudged (padding-right moves the modules, not the tray). polybar 3.7's
; internal/tray module draws inline instead, so it obeys ordering and padding.

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc    = true
; wm-restack=i3 was a click-breaker, confirmed by direct A/B test (simulated
; clicks via XTEST + checking i3 focused-workspace state before/after): with
; wm-restack=i3 clicks never register; with wm-restack=none they do. Trade-off
; kept deliberately: this bar will sit on top of fullscreen windows (mpv,
; fullscreen browser) since wm-restack=i3 is the only mechanism that tucks an
; override-redirect window below fullscreen, and it costs all clicks to use.
wm-restack    = none

; Floating (offset/width/radius honored, curved both ends). override-redirect
; makes this window invisible to i3, so it has no strut of its own — space is
; reserved via a live `gaps top` (see launch step), kept runtime-only after a
; baked-in `gaps top` + full i3 restart caused unrelated breakage.
override-redirect = true

; Fake transparency
pseudo-transparency = false

# ── Modules ─────────────────────────────────────────────────

[module/i3]
type            = internal/i3
format          = <label-state> <label-mode>
index-sort      = true
wrapping-scroll = false
strip-wsnumbers = true

label-focused            = %name%
label-focused-foreground = ${colors.text}
label-focused-background = ${colors.overlay}
label-focused-underline  = ${colors.pine}
label-focused-padding    = 2

label-unfocused            = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding    = 2

label-visible            = %name%
label-visible-foreground = ${colors.subtle}
label-visible-padding    = 2

label-urgent            = %name%
label-urgent-foreground = ${colors.love}
label-urgent-background = ${colors.base}
label-urgent-padding    = 2

label-mode            = %mode%
label-mode-foreground = ${colors.gold}
label-mode-padding    = 2

[module/tray]
type         = internal/tray
format       = <tray>
tray-size    = 18px
; 10, not 6: at 6 the icons sat ~10px apart while the whole tray sits ~34px
; from the separator, so they read as one clump. ~14px apart gives roughly a
; 1:2.5 item-to-group ratio.
tray-spacing = 10px
; 0, not 2: the gap before the tray measured 36px vs ~30px for every other
; separator. 2px of that was this padding. The rest is transparent margin
; baked into the Bluetooth icon's own pixmap (11px of ink in an 18px box),
; which polybar can't trim.
tray-padding = 0px

[module/sep]
type    = custom/text
content = " │ "
content-foreground = ${colors.hl-high}

[module/xwindow]
type              = internal/xwindow
label             = %title:0:50:...%
label-foreground  = ${colors.subtle}
label-maxlen      = 50

[module/date]
type          = internal/date
interval      = 1
date          = "%a %d %b"
time          = "%H:%M"
label         = " %date%   %time%"
label-foreground = ${colors.rose}

; [module/cpu]
; type                  = internal/cpu
; interval              = 2
; format-prefix         = "󰻠 "
; format-prefix-foreground = ${colors.foam}
; label                 = %percentage:2%%
; label-foreground      = ${colors.text}
; format-underline      = ${colors.foam}
;
; [module/memory]
; type                  = internal/memory
; interval              = 3
; format-prefix         = "󰍛 "
; format-prefix-foreground = ${colors.iris}
; label                 = %percentage_used%%
; label-foreground      = ${colors.text}
; format-underline      = ${colors.iris}

[module/volume]
type              = internal/pulseaudio
format-volume     = <ramp-volume> <label-volume>
label-volume      = %percentage%%
label-volume-foreground = ${colors.text}

label-muted         = 󰖁 muted
label-muted-foreground = ${colors.muted}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.gold}

format-volume-underline = ${colors.gold}
format-muted-underline  = ${colors.muted}

click-right = pavucontrol

[module/brightness]
; internal/backlight reads sysfs in-process and watches it with inotify, so it
; updates on change instead of polling. The old custom/script version ran
; `brightnessctl -m | awk` every 0.05s: 47 forks/sec, ~8.6% of a core, forever.
type = internal/backlight
card = intel_backlight
use-actual-brightness = true

format = <label>

label =  %percentage%%
label-foreground = ${colors.text}
format-underline = ${colors.iris}

; Scroll-to-dim on the bar is OFF, verified by XTEST, not assumed:
;   enable-scroll = true  -> the module handles the scroll itself by writing
;     /sys/class/backlight/intel_backlight/brightness. That file is root:video
;     664 and this user is not in the video group, so every notch logs
;     "Unable to change backlight value" and nothing moves.
;   enable-scroll = false -> the module registers no scroll handler, and the
;     legacy scroll-up/scroll-down commands below are NOT consulted for
;     internal modules. Also nothing moves, but without the error spam.
; So the commands are kept only as documentation of intent. To actually get
; scroll back: `sudo usermod -aG video $USER`, re-login, set enable-scroll=true
; and drop them. The XF86MonBrightness keys in the i3 config are unaffected
; either way; brightnessctl is setuid root and does not need the group.
enable-scroll = false
; scroll-up = brightnessctl set +5%
; scroll-down = brightnessctl set 5%-

[module/battery]
type                      = internal/battery
battery                   = BAT1
adapter                   = ACAD
full-at                   = 98
poll-interval             = 5

format-charging           = <animation-charging>  <label-charging>
format-discharging        = <ramp-capacity>  <label-discharging>
format-full               =  <label-full>

label-charging            = %percentage%%
label-discharging         = %percentage%%
label-full                = Full

label-charging-foreground   = ${colors.foam}
label-discharging-foreground = ${colors.text}
label-full-foreground       = ${colors.pine}

format-charging-underline   = ${colors.foam}
format-discharging-underline = ${colors.gold}
format-full-underline       = ${colors.pine}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-foreground = ${colors.gold}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-foreground = ${colors.foam}
animation-charging-framerate = 750

[module/network]
type            = internal/network
interface-type  = wireless
interval        = 3

format-connected    = <ramp-signal>  <label-connected>
label-connected     = %essid%
label-connected-foreground = ${colors.text}

format-disconnected    = 󰖪  <label-disconnected>
label-disconnected     = disconnected
label-disconnected-foreground = ${colors.muted}

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.pine}

format-connected-underline    = ${colors.pine}
format-disconnected-underline = ${colors.muted}

# [module/powermenu]
# type = custom/menu

expand-right = false
format-spacing = 1

label-open  = 󰐥
label-open-foreground = ${colors.love}
label-close =  cancel
label-close-foreground = ${colors.muted}
label-separator = |
label-separator-foreground = ${colors.hl-high}

